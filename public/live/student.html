<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student — Live Class</title>
<link rel="stylesheet" href="./live.css">
<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="./live.js" defer></script>
</head>
<body>

<header>
  <div class="brand">
    <a href="../student-dashboard.html"><div class="logo">ElevaLive</div></a>
    <div>Live Class</div>
  </div>
  <div class="header-actions">
    <div class="pill" id="liveStatus">Not Live</div>
    <span id="waitingNotice" style="margin-left:10px;color:#f59e0b;display:none;">Waiting for teacher approval...</span>
  </div>
</header>

<div class="container">
  <section class="left">
    <!-- Whiteboard & Code -->
    <div class="whiteboard-card">
      <div class="wb-top">
        <div>Board / Code</div>
      </div>
      <canvas id="wbCanvas" class="wb-canvas"></canvas>
      <textarea id="codeArea" placeholder="// Type your code here..." disabled></textarea>
      <div class="meta-row">
        <div id="currentTool">Tool: Pen</div>
        <div>Color: <span id="colorPreview"></span></div>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-card">
      <div>Class Chat</div>
      <div id="chatBox" class="chat-box"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Type message..." />
        <button id="btnSendChat">Send</button>
      </div>
    </div>
  </section>

  <aside class="right">
    <!-- Teacher Video -->
    <div class="teacher-card">
      <div>Teacher Video</div>
      <div class="teacher-video">
        <video id="teacherVideo" autoplay playsinline></video>
      </div>
    </div>

    <!-- Student Camera -->
    <div class="teacher-card">
      <div>Your Camera</div>
      <div class="teacher-video">
        <video id="studentVideo" autoplay muted playsinline></video>
      </div>
      <div class="teacher-controls">
        <button class="btn" id="btnCamToggle">Toggle Video</button>
        <button class="btn" id="btnMicToggle">Toggle Mic</button>
      </div>
    </div>

    <!-- Participants -->
    <div class="participants-card">
      <div>Participants</div>
      <div id="participantsList" class="participants-list"></div>
    </div>
  </aside>
</div>

<script>

window.addEventListener("DOMContentLoaded",async()=>{


const res=await fetch("/session");

const data=await res.json();



if(!data.loggedIn || data.user.role!=="student"){

alert("Access denied");

return location.href="/dashboard";

}



const username=data.user.username;

const role=data.user.role;

const userId=data.user._id;



initLiveCore(
role,
username,
userId
);

// SHOW WAITING

document.getElementById(
"waitingNotice"
).style.display="inline";


// Hide the "waiting for approval" notice once the teacher admits us.
// Camera + the actual WebRTC call setup are handled inside live.js -
// this page used to duplicate that logic separately (with a couple of
// calls to functions that didn't exist), which also fought with live.js's
// own listeners for the same events, so it's been removed in favor of
// just the one thing this page needs that live.js doesn't know about.
socket.on(
"admitted",
()=>{

document.getElementById(
"waitingNotice"
).style.display="none";

});

// If the class ends, go back to a "waiting" state rather than staying
// stuck on whatever was shown last.
socket.on(
"class-status",
live=>{

if(!live){

document.getElementById(
"waitingNotice"
).style.display="inline";

}

});

});

</script>

</body>
</html>
