<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher — Full Control</title>
<link rel="stylesheet" href="./live.css">
<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>
<body>

<header>
  <div class="brand">
<a href="#" id="goDashboard">
  <div class="logo">ElevaLive</div>
</a>
    <div>Live Class</div>
  </div>
  <div class="header-actions">
    <div class="pill" id="liveStatus">Not Live</div>
    <button class="btn primary" id="btnStartClass">Start Class</button>
    <button class="btn warn" id="btnEndClass">End Class</button>
  </div>
</header>

<div class="container">
  <section class="left">
    <!-- Whiteboard & Code -->
    <div class="whiteboard-card">
      <div class="wb-top">
        <div>Board / Code</div>
        <div class="wb-buttons">
          <button class="btn" id="btnToggleBoard">Toggle Board/Text</button>
          <div class="color-swatch selected" data-color="#FFD54F" style="background:#FFD54F"></div>
          <div class="color-swatch" data-color="#FF8A33" style="background:#FF8A33"></div>
          <div class="color-swatch" data-color="#FF3B30" style="background:#FF3B30"></div>
          <div class="color-swatch" data-color="#000000" style="background:#000000"></div>
          <div class="color-swatch" data-color="#0f15be" style="background:#0f15be"></div>
          <div class="color-swatch" data-color="#05ba68" style="background:#05ba68"></div>
          <input type="range" id="penSize" min="1" max="12" value="3">
          <button class="btn" id="btnErase">Eraser</button>
          <button class="btn" id="btnClear">Clear</button>
          <button class="btn" id="btnUndo">Undo</button>
          <button class="btn" id="btnRedo">Redo</button>
          <button class="btn" id="btnSaveBoard">Save Whiteboard</button>
          <button class="btn" id="btnSaveCode">Save Code</button>
          <button class="btn" id="btnShareWhiteboard">Share Board</button>
        </div>
      </div>
      <canvas id="wbCanvas" class="wb-canvas"></canvas>
      <textarea id="codeArea" placeholder="// Type your code here..."></textarea>
      <div class="meta-row">
        <div id="currentTool">Tool: Pen</div>
        <div>Color: <span id="colorPreview"></span></div>
      </div>
    </div>

    <!-- Tablet QR -->
    <button id="startTablet" class="control-btn">📱 Start Tablet Sharing</button>
    <span id="tabletStatus" style="margin-left:10px;color:#4ade80;display:none;">Tablet Connected</span>
    <div id="tabletQRContainer" style="margin-top:10px; display:none; text-align:center;">
      <p style="color:#111; font-weight:700;">Scan to connect tablet:</p>
      <canvas id="tabletQR"></canvas>
    </div>
  </section>

  <aside class="right">
    <!-- Teacher Camera -->
    <div class="teacher-card">
      <div>Teacher Camera</div>
      <div class="teacher-video">
        <div class="teacher-badge">HOST</div>
        <video id="teacherVideo" autoplay muted playsinline></video>
      </div>
      <div id="camStatus" style="position:absolute;bottom:8px;right:8px;background:#22c55e;color:#111;padding:3px 6px;border-radius:6px;font-size:12px;display:none;">Camera On</div>
      <div class="teacher-controls">
        <button class="btn" id="btnCamToggle">Toggle Video</button>
        <button class="btn" id="btnMicToggle">Toggle Mic</button>
        <button class="btn" id="btnScreenShare">Share Screen</button>
      </div>
    </div>
    <!-- <div class="teacher-card">
      <div>Student camera</div>
      <div class="teacher-video">
        <video id="studentVideo" autoplay muted playsinline></video>
      </div>
      <div class="teacher-controls">
        <button class="btn" id="btnCamToggle">Toggle Video</button>
        <button class="btn" id="btnMicToggle">Toggle Mic</button>
      </div>
    </div> -->

    <!-- Chat -->
    <div class="chat-card">
      <div>Class Chat</div>
      <div id="chatBox" class="chat-box"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Type message..." />
        <button id="btnSendChat">Send</button>
      </div>
    </div>

    <!-- Participants -->
    <div class="participants-card">
      <div>Participants</div>
      <div id="participantsList" class="participants-list"></div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn primary" id="btnAddStudent">+ Add Student</button>
      </div>
    </div>

    <div class="participants-card">
      <h4>Waiting Room</h4>
      <div id="waitingList"></div>
    </div>
  </aside>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="./live.js"></script>
<script>

window.addEventListener("DOMContentLoaded",async()=>{


const res=await fetch("/session");

const data=await res.json();


if(!data.loggedIn || data.user.role!=="teacher"){

alert("Access denied");

return location.href="/dashboard";

}

const username=data.user.username;

const role=data.user.role;

const userId=data.user._id;



initLiveCore(
role,
username,
userId
);

// LIVE STATUS

socket.on("class-status",live=>{

document.getElementById("liveStatus").innerText=
live?"Live":"Not Live";

});

// START CLASS

document.getElementById(
"btnStartClass"
).onclick=async()=>{


try{


// Assigning to live.js's shared `localStream` (not a local const) so that
// callStudent() in live.js can attach this camera/mic to each student's
// peer connection when they're admitted.
localStream=
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});

document.getElementById(
"teacherVideo"
).srcObject=localStream;



socket.emit(
"start-class"
);



}catch(err){

alert(err.message);

}


};

// END CLASS


document.getElementById(
"btnEndClass"
).onclick=()=>{


socket.emit(
"end-class"
);


const video=
document.getElementById(
"teacherVideo"
);


if(video.srcObject){

video.srcObject
.getTracks()
.forEach(t=>t.stop());

}
video.srcObject=null;
};




// CHAT


document.getElementById(
"btnSendChat"
).onclick=()=>{


const input=
document.getElementById(
"chatInput"
);


const msg=input.value.trim();


if(!msg)return;

socket.emit(
"chat",
{
name:username,
role:role,
message:msg
}
);


input.value="";


};

// DASHBOARD

document.getElementById(
"goDashboard"
).onclick=e=>{

e.preventDefault();

location.href=
"/teacher-dashboard.html";

};

});

</script>

</body>
</html>
